<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark" style="background-color: #10b981;">
    <div class="container">
        <span class="navbar-brand mb-0 h1">JR Portfolio — Admin</span>
        <div>
            <span class="text-white me-3">Welcome, {{ request.user.username }}</span>
            <a href="{% url 'admin_logout' %}" class="btn btn-outline-light btn-sm">Sign Out</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Dashboard</h1>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">
                        <i class="bi bi-folder-fill text-success"></i> Projects
                    </h5>
                    <p class="card-text text-muted">Manage your portfolio projects.</p>
                    <a href="{% url 'dashboard_projects' %}" class="btn btn-success">
                        View Projects
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">
                        <i class="bi bi-stack text-success"></i> Tech Stacks
                    </h5>
                    <p class="card-text text-muted">Manage the technologies you use.</p>
                    <a href="{% url 'dashboard_techstacks' %}" class="btn btn-success">
                        View Tech Stacks
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm">
            ← Back to Portfolio
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
